spring:
  datasource:
    url: jdbc:mysql://localhost:3306/carta_digital?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
    username: ${DB_USER:carta_digital}
    password: ${DB_PASSWORD:dev_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      # 2026-09-18: subido de 5MB a 65MB/130MB para acomodar la subida de
      # modelos 3D (.glb + .usdz juntos, ver AlmacenamientoModelo3dService --
      # tope de 60MB POR ARCHIVO, mas margen). Esto relaja el limite global
      # de Spring para TODOS los endpoints multipart, no solo modelos 3D --
      # por eso AlmacenamientoImagenService ahora valida su propio tope de
      # 5MB de forma explicita: sin eso, esta subida global habria relajado
      # en silencio el limite que protegia la subida de imagenes tambien.
      max-file-size: 65MB
      max-request-size: 130MB
  mvc:
    contentnegotiation:
      # 2026-09-18: sin esto, Tomcat/Spring sirven .glb/.usdz bajo /uploads/**
      # (ver WebConfig) como application/octet-stream -- el genérico que usan
      # para cualquier extensión que no reconocen. Para .usdz esto rompe AR
      # Quick Look en Safari/iOS: Apple exige el Content-Type exacto
      # model/vnd.usdz+zip para que un <a rel="ar">/<model-viewer ios-src>
      # abra el visor AR en vez de descargar el archivo a secas. .glb no lo
      # exige con el mismo rigor (Scene Viewer en Android es más tolerante),
      # pero model/gltf-binary es el tipo correcto según Khronos y no cuesta
      # nada declararlo bien.
      media-types:
        usdz: model/vnd.usdz+zip
        glb: model/gltf-binary
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false
    # Explícito a propósito (aunque hoy coincide con el default de Spring Boot):
    # JwtAuthenticationFilter activa el filtro de tenant vía
    # entityManager.unwrap(Session.class) y depende de que el mismo
    # EntityManager/Session viva durante todo el request. Si esto se pone en
    # false algún día (para evitar el antipatrón de lazy-loading en la vista),
    # el enforcement de tenant hay que rehacerlo con un interceptor por
    # transacción en vez de por request.
    open-in-view: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  uploads:
    # DISCO LOCAL a proposito (ver AlmacenamientoImagenService.java para el porque
    # y la limitacion conocida): un solo VPS/instancia, no S3 todavia.
    dir: ${UPLOADS_DIR:./uploads}
  jwt:
    # SIN valor por defecto a propósito: si falta la variable de entorno, la
    # aplicación debe fallar al arrancar, no arrancar igual usando un secreto
    # que vive en el historial de git. Un JWT_SECRET filtrado permite forjar
    # tokens de cualquier usuario/tenant/rol — es el riesgo más alto de todo
    # el sistema de auth, así que acá no hay "valor cómodo para desarrollo":
    # generen uno real incluso en local (ej. `openssl rand -base64 32`) y
    # pónganlo en su .env (ver .env.example).
    secret: ${JWT_SECRET}
    expiracion-acceso-ms: 900000    # 15 minutos
    expiracion-refresh-ms: 604800000 # 7 días

server:
  port: 8080

logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%p","tenant":"%X{tenantId}","requestId":"%X{requestId}","logger":"%logger{36}","mensaje":"%m"}%n'
