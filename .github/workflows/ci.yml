name: CI backend

# documentacion-tecnica.md §5.2: "Build + tests + lint en cada PR como
# mínimo no negociable." No existía ningún workflow hasta este PR — nada
# garantizaba hasta ahora que el proyecto compilara, y mucho menos que el
# test de aislamiento de tenant (§6) realmente corriera en algún lado.
#
# Alcance deliberadamente solo `backend/`: los frontends (app-cliente,
# app-admin) todavía son carpetas vacías (.gitkeep), agregar un job de
# lint/build para código que no existe sería un CI que aparenta cubrir algo
# que no cubre. Agregar esos jobs cuando exista un package.json real ahí.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # mvn verify incluye el umbral de cobertura de JaCoCo (ver pom.xml).
      - name: Build + tests + cobertura (mvn verify)
        working-directory: backend
        run: mvn -B verify

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  # Migraciones contra MySQL REAL (2026-11-27): los demas tests usan H2 con el
  # esquema generado por Hibernate, asi que solo aqui se ejecutan las
  # migraciones de Flyway y se valida que el esquema coincide con las entidades.
  migraciones-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: carta_digital
          MYSQL_USER: mezzalia
          MYSQL_PASSWORD: prueba_ci
          MYSQL_ROOT_PASSWORD: prueba_ci_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pprueba_ci_root"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Flyway + Hibernate validate contra MySQL 8.4
        working-directory: backend
        env:
          MEZZALIA_TEST_MYSQL_URL: jdbc:mysql://localhost:3306/carta_digital?serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&useSSL=false
          MEZZALIA_TEST_MYSQL_USER: mezzalia
          MEZZALIA_TEST_MYSQL_PASSWORD: prueba_ci
        run: mvn -B test -Dtest=MigracionesMySqlTest -Dsurefire.failIfNoSpecifiedTests=false

  # app-cliente ya no es una carpeta vacia. npm ci (no install) a proposito:
  # falla si package-lock.json no coincide con package.json -- exactamente lo
  # que paso en main con @google/model-viewer (commit bb1b642) sin que nada
  # lo detectara.
  app-cliente:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app-cliente
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/app-cliente/package-lock.json

      - run: npm ci
      # OWASP ASVS 5.0 V15.2: sin dependencias de produccion con
      # vulnerabilidades conocidas altas o criticas.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  # Auditoria 2026-09-08 paso 6: app-admin ya tiene package.json real y,
  # desde esta rama, tests (Vitest). npm ci (no install) a proposito: falla si
  # package-lock.json no coincide con package.json, que es justo el tipo de
  # error que se coló en main con app-cliente (commit bb1b642).
  app-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app-admin
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/app-admin/package-lock.json

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
